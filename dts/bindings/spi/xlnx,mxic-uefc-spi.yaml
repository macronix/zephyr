description: xlnx uefc SPI controller

bus: spi

compatible: "xlnx,mxic-uefc-spi"

include: base.yaml

properties:
  reg:
    required: true
  clock-frequency:
    type: int
    description: |
      Clock frequency the SPI peripheral is being driven at, in Hz.
  "#address-cells":
    required: true
    const: 1
  "#size-cells":
    required: true
    const: 0

